<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lifeline</title>
<meta name="theme-color" content="#EDE6D6">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  :root { --paper: #EDE6D6; --panel: #F7F2E7; --ink: #1F1B16; --ink-2: #4F473C; --accent: #2D4A3A; --on-accent: #F7F2E7; --plate: #B9CCA6; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0F1411; --panel: #161D18; --ink: #ECE5D3; --ink-2: #C3BBA8; --accent: #8DB39A; --on-accent: #0F1411; --plate: #4D6340; } }
  @font-face { font-family: "EB Garamond"; font-style: normal; font-display: swap; font-weight: 400 800; src: url("/fonts/eb-garamond-latin-wght-normal.woff2") format("woff2"); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 400 1.125rem/1.55 "EB Garamond", Georgia, serif; }
  .card { position: relative; max-width: 420px; width: 100%; padding: 24px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--panel); box-shadow: 4px 4px 0 0 var(--plate); }
  h1 { margin: 0 0 8px; font-weight: 400; font-size: 1.95rem; line-height: 1.1; }
  p { margin: 0 0 16px; color: var(--ink-2); }
  button { font: 600 1rem/1 "EB Garamond", Georgia, serif; padding: 12px 18px; border: 1.5px solid var(--ink); border-radius: 7px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="card">
    <h1>You're offline.</h1>
    <p>lifeline needs a connection to fetch your day. Everything you've told it is safe, and reminders still arrive on Telegram or as notifications once you're back.</p>
    <button type="button" onclick="location.href='/#today'">Try again</button>
  </main>
</body>
</html>
